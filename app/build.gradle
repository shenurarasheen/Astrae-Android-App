plugins {
    alias(libs.plugins.android.application)
    id 'com.google.gms.google-services'
    id 'com.google.android.libraries.mapsplatform.secrets-gradle-plugin'
}

android {
    namespace 'com.synapse.astraemobileapp'
    compileSdk 36

    defaultConfig {
        applicationId "com.synapse.astraemobileapp"
        minSdk 28
        targetSdk 36
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    buildFeatures {
        buildConfig true
        viewBinding true
    }
}

dependencies {

    //firebase dependencies
    implementation platform(libs.firebase.bom)
    implementation libs.firebase.analytics
    implementation(libs.firebase.auth)
    implementation(libs.firebase.firestore)
    implementation(libs.firebase.storage)

    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout
    implementation libs.recyclerview
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core

    //lombok
    implementation(libs.lombok)
    compileOnly(libs.lombok)
    annotationProcessor(libs.lombok)

    //glide dependency - for image loading
    implementation libs.glide

    //dot-indicator dependency
    implementation(libs.dotsindicator)

    //google flexbox layout dependency
    implementation libs.flexbox

    //payhere dependencies
    implementation libs.payhere.android.sdk
    implementation libs.gson

    //MPAndroidChart dependency
    implementation libs.mpandroidchart

    // Maps SDK for Android
    implementation libs.play.services.maps

    implementation libs.play.services.location

    //place api
    implementation(libs.places)
}