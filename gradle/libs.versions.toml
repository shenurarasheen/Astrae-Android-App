[versions]
agp = "8.12.3"
dotsindicator = "5.1.0"
firebaseBom = "34.9.0"
flexbox = "3.0.0"
glide = "5.0.5"
gson = "2.8.0"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
appcompat = "1.7.1"
lombok = "1.18.42"
material = "1.13.0"
activity = "1.12.3"
constraintlayout = "2.2.1"
mpandroidchart = "v3.1.0"
payhereAndroidSdk = "v3.0.18"
